[project]
name = "deepnum"
version = "0.1.0"
description = "A modular Deep Learning framework built from scratch using NumPy. Implements different layers, activation functions, and loss with backpropagation. Developed for self-educational purposes to bridge the gap between theory and implementation and test my own low level understanding."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "requests>=2.32.5",
    "ipykernel>=7.2.0"
]

[tool.uv]
index-url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package Configuration
[tool.hatch.build.targets.wheel]
packages = ["deepnum"]

# Development Dependencies (installed via `uv sync`)
[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

# Ruff Linter & Formatter Configuration
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernize syntax)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

